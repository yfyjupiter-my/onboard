# COM-012: rotate container logs (nginx client IPs, export audit lines) — ≤ 50 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-country: &country
  image: onboard-web:latest
  pull_policy: never   # built by `web`; never fetched from a registry
  restart: unless-stopped
  logging: *logging
  environment:
    MINIO_ENDPOINT: http://minio:9000
    GUNICORN_WORKERS: "2"   # host RAM is tight; 2 workers is ample for one country's joiners
  depends_on:
    db:
      condition: service_healthy
    minio:
      condition: service_healthy
  command: >
    sh -c "python manage.py migrate --noinput &&
           python manage.py clearsessions &&
           python manage.py collectstatic --noinput &&
           exec gunicorn onboard.wsgi:application --bind 0.0.0.0:8000 --workers $${GUNICORN_WORKERS:-3} --timeout 120"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/admin/login/"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onboard}
      POSTGRES_USER: ${POSTGRES_USER:-onboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *logging
    command: server /data --console-address ":9001"
    ports:
      # SEC-009: loopback only — the console logs in with MinIO root creds. Use an SSH
      # tunnel to reach it remotely. :9000 stays internal so files remain presign-only.
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:   # Malaysia (/). T7.3: also builds the image the per-country web-* services run
    build: ./web
    image: onboard-web:latest
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-onboard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-onboard}
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py clearsessions &&
             python manage.py collectstatic --noinput &&
             exec gunicorn onboard.wsgi:application --bind 0.0.0.0:8000 --workers $${GUNICORN_WORKERS:-3} --timeout 120"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/admin/login/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - static:/app/staticfiles

  # T7.3 (D18): one instance per country on the shared db/minio/nginx. Each reads ONLY its own
  # env/<cc>.env (own SECRET_KEY, database role, bucket-scoped MinIO key, language, tz, URL prefix):
  # no root Postgres or MinIO credentials reach these containers.
  web-vn:   # Vietnam (/vn/) — T7.3 (D18)
    <<: *country
    env_file: env/vn.env
  web-th:   # Thailand (/th/) — T7.3 (D18)
    <<: *country
    env_file: env/th.env
  web-id:   # Indonesia (/id/) — T7.3 (D18)
    <<: *country
    env_file: env/id.env

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "8001:80"
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-onboard-media}
      # Only substitute MINIO_BUCKET in templates; leave nginx runtime vars
      # ($host/$1/$scheme) untouched so the presign-signing Host header can't
      # be blanked by an unrelated env var. (SEC-008)
      NGINX_ENVSUBST_FILTER: MINIO_BUCKET
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static:/app/staticfiles:ro
    depends_on:
      - web
      - minio

volumes:
  pgdata:
  minio-data:
  static:
