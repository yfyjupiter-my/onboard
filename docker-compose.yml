services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onboard}
      POSTGRES_USER: ${POSTGRES_USER:-onboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-onboard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-onboard}
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn onboard.wsgi:application --bind 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/admin/login/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - static:/app/staticfiles

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "90:80"
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-onboard-media}
      # Only substitute MINIO_BUCKET in templates; leave nginx runtime vars
      # ($host/$1/$scheme) untouched so the presign-signing Host header can't
      # be blanked by an unrelated env var. (SEC-008)
      NGINX_ENVSUBST_FILTER: MINIO_BUCKET
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static:/app/staticfiles:ro
    depends_on:
      - web
      - minio

volumes:
  pgdata:
  minio-data:
  static:
