<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ribbon playground — 3 options</title>
<style>
@font-face{font-family:Inter;src:url(web/static/fonts/inter.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url(web/static/fonts/bricolage.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{
  --bg:#fbf7f0; --surface:#fff; --text:#25201b; --muted:#6f6457;
  --primary:#0f766e; --primary-ink:#fff; --accent:#a84e08;
  --line:#ece3d6; --ok:#0f766e; --radius:16px;
  --shadow:0 2px 6px rgba(120,90,40,.08);
  --ease:cubic-bezier(.2,.8,.2,1);
  --gold:#e0a43a; --teal-soft:#5fb3a8; --clay:#d9774a;   /* tints derived from primary/accent */
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 Inter,system-ui,sans-serif;padding:18px}
button{font:inherit}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;
  color:var(--text);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--text) 6%,transparent)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.title{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;letter-spacing:-.04em;line-height:.95;margin:0;font-size:34px}
.title em{font-style:normal;font-weight:500;color:var(--primary)}

/* ---------- playground chrome ---------- */
.head{max-width:1000px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.head h1{font-size:15px;margin:0 12px 0 0;font-weight:700}
.tabs{display:flex;max-width:100%;overflow-x:auto;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:99px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--text);color:var(--bg)}
.note{max-width:1000px;margin:0 auto 10px;font-size:13px;color:var(--muted)}
.stage{max-width:1000px;margin:0 auto;height:72vh;min-height:480px;overflow:hidden auto;border:1px dashed #d9ccb8;
  border-radius:20px;background:var(--bg);position:relative;padding:0 18px 18px}
.stage[hidden]{display:none}

/* fake checklist */
.page .title{margin:26px 0 6px}
.page p{margin:0 0 18px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.tile i{display:block;height:70px;border-radius:12px;background:color-mix(in srgb,var(--primary) 9%,var(--surface));margin-bottom:10px}
.tile b{display:block;font-size:15px}
.tag{display:inline-flex;font-size:11px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid;margin-top:6px;
  color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}

/* ---------- the real top bar (copied from app.css T6.7) ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  margin:0 -18px 18px;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .spacer{flex:1}
.brand{color:inherit;text-decoration:none;display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.mark{width:28px;height:28px;border-radius:8px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none;position:relative}
.greet{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.greet small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .3s}
.rail{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--primary);
  transform-origin:left;transform:scaleX(var(--p,.8));transition:transform .9s var(--ease)}
.fx{position:absolute;inset:0;pointer-events:none;overflow:visible}
.done .count{color:var(--primary);font-weight:700}

/* =====================================================================
   A · Ribbon burst — curled ribbons shoot out of the rail's end and flutter down
   ===================================================================== */
#a .rib{position:absolute;top:100%;width:7px;height:18px;border-radius:2px;opacity:0;
  background:var(--c);transform-origin:50% 0;will-change:transform,opacity}
#a.done .rib{animation:a-burst var(--d) cubic-bezier(.15,.7,.3,1) var(--delay) forwards}
@keyframes a-burst{
  0%  {opacity:1;transform:translate(0,0) rotate(0) rotateY(0)}
  35% {opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--r)) rotateY(180deg)}
  100%{opacity:0;transform:translate(calc(var(--x)*1.3),calc(var(--y) + 420px)) rotate(calc(var(--r)*3)) rotateY(900deg)}
}
#a.done .mark{animation:pop .5s .9s var(--ease)}
@keyframes pop{40%{transform:scale(1.25)}}

/* =====================================================================
   B · Sash ribbon — rail thickens into a shimmering ribbon, a notched
       "All done" pennant unfurls from the right edge
   ===================================================================== */
#b .rail{transition:transform .9s var(--ease),height .4s .9s var(--ease),background .4s .9s}
#b.done .rail{height:5px;background:linear-gradient(90deg,var(--primary),var(--teal-soft) 50%,var(--gold))}
#b .rail::after{content:"";position:absolute;inset:0;opacity:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.85) 50%,transparent 70%);background-size:40% 100%;background-repeat:no-repeat}
#b.done .rail::after{animation:b-sheen 1.4s 1.2s ease-in-out 2}
@keyframes b-sheen{0%{opacity:1;background-position:-40% 0}100%{opacity:1;background-position:140% 0}}
#b .pennant{position:absolute;right:18px;top:calc(100% + 4px);display:flex;align-items:center;gap:6px;
  padding:4px 22px 4px 12px;font-size:12px;font-weight:700;letter-spacing:.04em;color:#fff;
  background:linear-gradient(90deg,var(--accent),#7c3a06);   /* white text stays AA (≥5.6:1) */
  clip-path:polygon(0 0,100% 0,calc(100% - 10px) 50%,100% 100%,0 100%);
  transform-origin:right top;transform:scaleX(0) ;opacity:0;filter:drop-shadow(0 2px 3px rgba(120,90,40,.25))}
#b.done .pennant{animation:b-unfurl .7s 1.1s var(--ease) forwards}
@keyframes b-unfurl{0%{opacity:1;transform:scaleX(0) rotate(-6deg)}70%{transform:scaleX(1.05) rotate(2deg)}100%{opacity:1;transform:none}}
#b.done .mark{animation:pop .5s 1s var(--ease)}

/* =====================================================================
   C · Streamer cascade — wavy party streamers drop from the whole bar edge
   ===================================================================== */
#c .streamer{position:absolute;top:100%;width:22px;height:150px;overflow:visible;opacity:0}
#c .streamer path{fill:none;stroke:var(--c);stroke-width:4;stroke-linecap:round;stroke-dasharray:260;stroke-dashoffset:260}
#c.done .streamer{animation:c-fall 2.6s var(--delay) cubic-bezier(.3,.6,.4,1) forwards}
#c.done .streamer path{animation:c-draw .9s var(--delay) var(--ease) forwards}
@keyframes c-draw{to{stroke-dashoffset:0}}
@keyframes c-fall{0%{opacity:1;transform:translateY(0) rotate(0)}70%{opacity:1}
  100%{opacity:0;transform:translateY(var(--y)) rotate(var(--r))}}
#c .rail{transition:transform .9s var(--ease),box-shadow .5s .9s}
#c.done .rail{box-shadow:0 0 12px color-mix(in srgb,var(--primary) 60%,transparent)}
#c.done .mark{animation:pop .5s .9s var(--ease)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  #b.done .pennant{opacity:1;transform:none}   /* static end state, no motion */
}
</style>

<div class="head">
  <h1>Progress bar ribbon · on 100%</h1>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-t="a">A · Ribbon burst</button>
    <button role="tab" aria-selected="false" data-t="b">B · Sash + pennant</button>
    <button role="tab" aria-selected="false" data-t="c">C · Streamer cascade</button>
  </div>
  <span class="spacer" style="flex:1"></span>
  <button class="btn" id="reset">Reset to 4 of 5</button>
  <button class="btn primary" id="play">Complete last item ▶</button>
</div>
<p class="note" id="desc"></p>

<template id="bar">
  <header class="topbar">
    <a class="brand" href="#"><span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span class="greet"><small>Welcome back</small><span class="who">chris.goh</span></span></a>
    <span class="spacer"></span>
    <span class="count">4 of 5 complete</span>
    <button class="btn">Log out</button>
    <span class="rail" aria-hidden="true"></span>
    <span class="fx" aria-hidden="true"></span>
  </header>
  <div class="page">
    <h2 class="title">Your onboarding <em>checklist</em></h2>
    <p>Work through each item. Some end with a short quiz.</p>
    <div class="grid">
      <div class="tile"><i></i><b>Employee handbook</b><span class="tag">Completed</span></div>
      <div class="tile"><i></i><b>IT security basics</b><span class="tag">Completed</span></div>
      <div class="tile"><i></i><b>Passwords</b><span class="tag">Completed</span></div>
      <div class="tile"><i></i><b>Phishing</b><span class="tag">Completed</span></div>
      <div class="tile"><i></i><b>Final quiz</b><span class="tag last">In progress</span></div>
    </div>
    <div style="height:500px"></div>
  </div>
</template>

<section class="stage" id="a"></section>
<section class="stage" id="b" hidden></section>
<section class="stage" id="c" hidden></section>

<script>
const notes = {
  a: 'A · ~24 curled ribbons in teal/amber/gold shoot up-left from the end of the rail, spin and flutter down (≈2s). Check mark pops. Rail stays 3px.',
  b: 'B · Rail thickens to 5px and turns into a teal→gold gradient sash, a sheen sweeps across twice, and a notched "All done" pennant unfurls under the right edge and stays. Calmest; no particles.',
  c: 'C · Wavy party streamers draw themselves along the full width of the bar, drop and fade (≈2.5s). Rail glows. Most festive.'
};
const colors = ['var(--primary)','var(--accent)','var(--gold)','var(--teal-soft)','var(--clay)'];
const rnd = (a, b) => a + Math.random() * (b - a);

function build(id) {
  const s = document.getElementById(id);
  s.replaceChildren(document.getElementById('bar').content.cloneNode(true));
  const fx = s.querySelector('.fx');
  if (id === 'a') {
    for (let i = 0; i < 24; i++) {
      const r = document.createElement('i'); r.className = 'rib';
      r.style.cssText = `right:${rnd(0,30)}px;--c:${colors[i%5]};--x:${rnd(-360,-20)}px;--y:${rnd(-40,90)}px;--r:${rnd(-180,180)}deg;--d:${rnd(1.6,2.4)}s;--delay:${rnd(.85,1.05)}s`;
      fx.append(r);
    }
  } else if (id === 'b') {
    const p = document.createElement('span'); p.className = 'pennant';
    p.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>All done';
    s.querySelector('.topbar').append(p);
  } else {
    for (let i = 0; i < 18; i++) {
      const w = Math.round(rnd(8,14));
      const svg = `<svg class="streamer" viewBox="0 0 22 150" style="left:${(i+.5)/18*100}%;--c:${colors[i%5]};--y:${rnd(180,380)}px;--r:${rnd(-25,25)}deg;--delay:${rnd(.85,1.25)}s">
        <path d="M11 0 q${w} 12 0 25 t0 25 t0 25 t0 25 t0 25 t0 25"/></svg>`;
      fx.insertAdjacentHTML('beforeend', svg);
    }
  }
  s.querySelector('.rail').style.setProperty('--p', .8);
}

function play(id) {
  build(id);
  const s = document.getElementById(id);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    s.classList.remove('done');
    s.querySelector('.rail').style.setProperty('--p', 1);
    s.querySelector('.count').textContent = '5 of 5 complete';
    const last = s.querySelector('.last'); last.textContent = 'Completed';
    s.classList.add('done');
  }));
}

let cur = 'a';
function show(id) {
  cur = id;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === id));
  document.querySelectorAll('.stage').forEach(s => s.hidden = s.id !== id);
  document.getElementById('desc').textContent = notes[id];
  history.replaceState(null, '', '#' + id);
  play(id);
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => show(b.dataset.t));
document.getElementById('play').onclick = () => play(cur);
document.getElementById('reset').onclick = () => { document.getElementById(cur).classList.remove('done'); build(cur); };
['a','b','c'].forEach(build);
show(['a','b','c'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'a');
</script>
